; FC3PerformancePatch configuration
; Place this file next to version.dll in the game's "bin" folder.
; Lines starting with ';' are comments. Delete the file to return to defaults.

[General]
; 0 = behave as a plain version.dll (no patches, no log file).
Enabled=1
; 0 = no log, 1 = errors only, 2 = normal, 3 = debug.
; The log is written to FC3PerformancePatch.log next to this file. It never
; contains folder paths, user names or machine names.
LogLevel=2

[CPU]
; Fixes the start-up hang / crash on processors with 32 or more threads.
FixCoreEnumeration=1

; How the game is allowed to use the processor:
;   engine  - (default) the game's own threads are placed on the cores chosen
;             below; the graphics driver, DXVK and audio threads stay free.
;   process - additionally restrict the whole process to those cores
;             (same effect as setting the affinity in Task Manager).
;   off     - leave the game's processor detection untouched.
Mode=engine

; Number of physical cores the game may use. 0 = all (the engine itself
; cannot use more than 15). 4 to 6 works best for this engine.
MaxCores=6

; 0 = one thread per physical core (skips Hyper-Threading / SMT siblings).
; 1 = use both threads of each chosen core.
UseSMT=0

; On hybrid processors (Intel 12th gen and newer) prefer performance cores.
PreferPerformanceCores=1

; 1 = avoid the first core, which usually carries most of the system's
; interrupt load, when enough other cores are available.
SkipCore0=0

; Optional explicit list of logical processors, e.g. 0,2,4,6 or 2-7.
; When set it replaces MaxCores / UseSMT / PreferPerformanceCores / SkipCore0.
Cores=

[Timing]
; Requested system timer resolution in milliseconds (0 = leave unchanged).
; Windows 10 2004 and newer give every process the coarse 15.6 ms default
; unless it asks for better; the game never asks.
TimerResolutionMs=1

; EXPERIMENTAL, off by default. Turns the engine's Sleep(0) spin-waits into
; real yields. May reduce contention on some systems; untested in general.
SleepZeroYield=0

[Memory]
; Enable the Large Address Aware flag on the game executable so the game can
; use 4 GB of address space instead of 2 GB. The original file is kept as
; "<name>.exe.fc3pp-<date>.bak". Takes effect on the launch after the first.
ApplyLargeAddressAware=1

[Debug]
; Log every processor-related call the engine makes (needs LogLevel=3).
TraceCpuApi=0
; Testing aid: with Mode=off, pretend the system affinity mask is this value
; (0xFFFFFFFF reproduces the 32-thread start-up hang on any machine when
; FixCoreEnumeration=0). Leave at 0.
SimulateAffinityMask=0
