; FC3PerformancePatch configuration
; Place this file next to version.dll in the game's "bin" folder.
; Lines starting with ';' are comments. Delete the file to return to defaults.

[General]
; 0 = behave as a plain version.dll (no patches, no log file).
Enabled=1
; 0 = no log, 1 = errors only, 2 = normal, 3 = debug.
; The log is written to FC3PerformancePatch.log next to this file; the log of
; the previous start is kept as FC3PerformancePatch.previous.log. It never
; contains folder paths, user names or machine names.
LogLevel=2

[CPU]
; Fixes the start-up hang / crash on processors with 32 or more threads.
FixCoreEnumeration=1

; How the game is allowed to use the processor:
;   engine  - (default) the game's own threads are placed on the cores chosen
;             below; the graphics driver, DXVK and audio threads stay free.
;   process - additionally restrict the whole process to those cores
;             (same effect as setting the affinity in Task Manager).
;   off     - leave the game's processor detection untouched.
Mode=engine

; Number of physical cores the game may use. 0 = all (the engine itself
; cannot use more than 15). 4 to 6 works best for this engine.
MaxCores=6

; 0 = one thread per physical core (skips Hyper-Threading / SMT siblings).
; 1 = use both threads of each chosen core.
UseSMT=0

; On hybrid processors (Intel 12th gen and newer) prefer performance cores.
PreferPerformanceCores=1

; For processors whose cores differ in speed. The game pins one worker to
; every core it is given, but not its main and render threads, which are
; the ones that limit the frame rate. This many of the fastest cores are
; kept free of workers, so that the system can give them to those threads.
;   auto - 2 on ARM processors with faster and slower cores under Wine
;          (ARM handhelds running the game through FEX), 0 everywhere else
;   0..4 - that many, on any processor that reports faster and slower cores
; Never a core of the slowest kind, and never so many that fewer than two
; cores are left. Needs PreferPerformanceCores=1; ignored with Cores=.
SpareFastCores=auto

; 1 = avoid the first core, which usually carries most of the system's
; interrupt load, when enough other cores are available.
SkipCore0=0

; Optional explicit list of logical processors, e.g. 0,2,4,6 or 2-7.
; When set it replaces MaxCores / UseSMT / PreferPerformanceCores / SkipCore0.
Cores=

[Timing]
; Requested system timer resolution in milliseconds (0 = leave unchanged).
; Windows 10 2004 and newer give every process the coarse 15.6 ms default
; unless it asks for better; the game never asks.
TimerResolutionMs=1

; EXPERIMENTAL, off by default. Turns the engine's Sleep(0) spin-waits into
; real yields. May reduce contention on some systems; untested in general.
SleepZeroYield=0

[Memory]
; Enable the Large Address Aware flag on the game executable so the game can
; use 4 GB of address space instead of 2 GB. The original file is kept as
; "<name>.exe.fc3pp-<date>.bak" (rename it back to undo). Takes effect on the
; launch after the first.
ApplyLargeAddressAware=1

[Display]
; DirectX 11 only. Without this, switching away from the fullscreen game
; (Alt+Tab, Windows key) brings it back as a window and it stays windowed:
; the engine mistakes Windows dropping fullscreen for you pressing Alt+Enter.
; With it, fullscreen comes back when the game window is active again.
; Alt+Enter and the in-game Fullscreen option keep working.
RestoreFullscreenOnFocus=1

; Mark the game as DPI aware. The executables are not, so on a display scaled
; above 100 % Windows otherwise reports a smaller desktop to the game and
; blurs windowed / borderless output. Same as the "High DPI scaling override:
; Application" compatibility setting.
HighDpiAware=1

; Stop Windows from swapping the game window for a "Not responding" ghost
; while the game is busy loading.
DisableWindowGhosting=1

[Textures]
; DirectX 11 only. Makes texture mods safe to use with the game's normal
; settings. The game keeps the largest version of most textures in a separate
; "mip0" file and assumes it is exactly twice the size of the base texture.
; Mods that replace one of the two without the other break that assumption,
; and the game then crashes in the graphics driver while loading - which is
; why such mods tell you to set DisableMip0Loading="1" in GamerProfile.xml,
; at the price of lower detail on every texture the mod did not replace.
; With this, a mip0 file that does not fit its texture is simply not loaded;
; everything else keeps its full detail.
SkipMismatchedMip0=1

; A mod can also replace a texture and leave the game's original mip0 file in
; place where that file happens to have the right size. Nothing crashes then,
; but up close the original picture shows instead of the mod's: the ground
; changes texture a few metres ahead of you as you walk. With this, the patch
; reads the game's archives when the game starts (a fraction of a second),
; finds those files and leaves them out as well.
SkipReplacedTextureMip0=1

; Far Cry 3 only (both renderers). Some texture mods make several textures
; name the same mip0 file. The game is built for one texture per mip0 file:
; it links the file to one of them, and when it unloads the file later, often
; hours into a session, that texture may be long gone - the game then writes
; into freed memory and crashes (or quietly damages something else). With
; this, the patch finds such files when the game starts and keeps the game
; from loading them. The textures concerned stay at the detail of their base
; file, which for all but one of them is what they should have had anyway.
SkipSharedMip0=1

[Menu]
; DirectX 11 only. A settings menu inside the game: press the key below, or
; hold both thumbsticks in on a gamepad. Arrow keys or D-pad to move and
; change, Enter or A to switch, Backspace, Escape or B to close. What you
; change there is written to this file; most settings take effect the next
; time the game starts. The game does not see the keys used in the menu.
Enabled=1
; F1 to F12, Home, End, Insert, Delete, Pause, ScrollLock, PageUp, PageDown or Tab.
Key=F8
; Gamepad buttons that open and close the menu when held together for a
; moment. Two or more of: A B X Y LB RB L3 R3 Back Start Up Down Left Right,
; joined with +. L3 and R3 are the thumbsticks pressed in. None = no gamepad
; combination. The game does not see these buttons while all of them are held.
; With Steam Input (Steam Deck, Big Picture) you can instead bind a spare
; button, such as a back grip, to the key above.
PadButtons=L3+R3
; Size of the menu in percent, 100 to 200. Larger suits a handheld or a
; television across the room. Can be changed in the menu itself.
Scale=100

[Controls]
; Off by default: new, and not yet confirmed in play.
; The game has a "Use gamepad" option and stays in the mode chosen there.
; With this, it follows what you touch instead: press something on the
; gamepad and the game is in gamepad mode; press a key or move the mouse and
; it is in keyboard and mouse mode. The in-game menu (F8) switches this on
; and off without a restart. Leave it off if your controller also sends
; keyboard or mouse input (a Steam Input layout that uses a trackpad or the
; gyro as a mouse): the game would keep switching back and forth.
AutoSwitchInput=0

[Graphics]
; Draw distance. 0 = the game's own (default).
;    1 = far, 2 = very far: detailed models, trees and terrain are kept up
;        to further away and the sun's shadows reach further. It costs frame
;        rate; "very far" costs a lot.
;   -1 = near, -2 = very near: the opposite, for devices on which the game
;        is too slow even on its lowest settings (handhelds, ARM devices
;        that run it through an emulator). Models and plants give way to
;        simpler ones or disappear sooner and shadows end closer, so the
;        game has less to work through for every picture. It shows: things
;        pop in closer to you. Not yet measured how much it gains.
; The values start from the game's own settings (or a mod's, if it brings
; its own) and are handed to the game as it reads GamerProfile.xml; the file
; itself is not changed, and 0 gives you the original game back. Sections
; named Geometry, Shadow or Terrain that you have put into GamerProfile.xml
; yourself are kept as they are.
; The game reads these values once, when it starts: a change here or in the
; in-game menu shows after the game has been closed and started again. The
; menu's status lines say which value is in use.
; The first time a preset is applied, a copy of GamerProfile.xml is saved
; next to it as GamerProfile.xml.fc3pp.bak, in case you want your settings
; back exactly as they were.
DrawDistance=0

[Audio]
; The game's sound runs on XAudio2 2.7, which has a known defect: in some
; situations XAudio2_7.dll is unloaded while the game still uses it, and the
; game crashes (the crash report names "XAudio2_7.dll_unloaded"). This keeps
; the DLL loaded until the game exits. It does not change the sound.
KeepXAudio2Loaded=1

[Debug]
; Log every processor-related call the engine makes (needs LogLevel=3).
TraceCpuApi=0

; Writes to the log, when the game exits, which of its threads used the
; processor most (over the whole session, and in its busiest half minute),
; where the game placed them and on which processors the threads that draw
; the picture and read the input were seen. Costs one look at the threads
; every 30 seconds. The in-game menu can also measure 30 seconds on request.
ThreadReport=1
; Log how the game uses the sound system: output device format, mixer setup
; and the sample rates of the sounds it plays. The device name is not logged.
TraceAudio=0
; Testing aid: with Mode=off, pretend the system affinity mask is this value
; (0xFFFFFFFF reproduces the 32-thread start-up hang on any machine when
; FixCoreEnumeration=0). Leave at 0.
SimulateAffinityMask=0
