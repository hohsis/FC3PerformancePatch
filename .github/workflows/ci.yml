name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC, 32-bit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: OPSEC audit of the whole history
        run: python tools/opsec_audit.py --history --tree

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path src/fc3pp.h -Pattern 'FC3PP_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          $zip = "FC3PerformancePatch-$version.zip"
          Compress-Archive -Path build/package/FC3PerformancePatch/* -DestinationPath $zip
          # LF line ending, so "sha256sum --check" accepts the file on Linux as well.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash  $zip`n")
          Get-Content "$zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: FC3PerformancePatch
          path: |
            FC3PerformancePatch-*.zip
            FC3PerformancePatch-*.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux (MinGW-w64 cross build, tests under Wine)
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree=;mshtml=
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the cross compiler, Wine and shellcheck
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 wine wine32:i386 shellcheck \
            xvfb xauth libgl1:i386 libgl1-mesa-dri:i386

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-i686.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare the Wine prefix
        run: wine cmd /c ver

      # A virtual display and Mesa's software OpenGL, so that the in-game menu is
      # drawn for real under Wine (font, shader compiler, Direct3D 11 calls).
      - name: Test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build --output-on-failure

      - name: Shellcheck
        run: shellcheck -S warning tools/hooks/pre-commit tools/hooks/pre-push

  release:
    name: Publish release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the package built by the Windows job
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name FC3PerformancePatch

      - name: Verify the checksum file
        run: sha256sum --check FC3PerformancePatch-*.zip.sha256

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            FC3PerformancePatch-*.zip FC3PerformancePatch-*.zip.sha256 \
            --title "FC3PerformancePatch ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE_NOTES.md
