name: ARM64 (FEX)

# Runs the test suite on an ARM64 machine, with the 32-bit x86 test programs
# executed by ARM64 Wine through the FEX emulator - the same arrangement Valve's
# ARM builds of Proton use, and the one ARM handhelds run the game with.
# Experimental and separate from the main CI: it depends on a third-party Wine
# build (Hangover) and says nothing about big.LITTLE processors, GPUs or Android.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stress_scenario:
        description: Runtime scenario to run many times after the tests (empty = none)
        default: ''
      stress_count:
        description: How many times
        default: '40'

permissions:
  contents: read

jobs:
  fex:
    name: Linux ARM64 (tests under Wine + FEX)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree=;mshtml=
      HODLL: libwow64fex.dll
    steps:
      - uses: actions/checkout@v7

      - name: Install the cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 cmake

      - name: Install Wine for ARM64 with FEX (Hangover)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Outside the checkout: the privacy audit scans every file in it.
          mkdir "$RUNNER_TEMP/hangover" && cd "$RUNNER_TEMP/hangover"
          gh release download --repo AndreRH/hangover --pattern '*ubuntu2404_noble_arm64.tar'
          tar -xf ./*.tar
          ls -1
          sudo apt-get install -y ./*.deb
          command -v wine
          wine --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-i686.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare the Wine prefix
        run: wine cmd /c ver

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # For hunting something that only goes wrong now and then under the emulator.
      - name: Run one scenario many times
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.stress_scenario != '' }}
        env:
          SCENARIO: ${{ inputs.stress_scenario }}
          COUNT: ${{ inputs.stress_count }}
        run: |
          for linger in 200 0; do
            echo "=== the host waits $linger ms before it ends"
            python3 tests/runtime/run_runtime.py --bin-dir build/runtime --dll build/version.dll \
              --work-dir build/stress-work --emulator=wine --only "$SCENARIO" --repeat "$COUNT" --timeout 45 \
              --linger-ms "$linger" | grep -v '^\[ OK \]' | cut -c1-300 || true
            wineserver -k || true
          done

      - name: Show what the patch saw
        if: always()
        run: |
          log=$(find build/runtime-work/engine -name 'FC3PerformancePatch.log' | head -n 1)
          if [ -n "$log" ]; then head -n 14 "$log"; fi
          # the processor with faster and slower cores, and the thread report
          for scenario in fastcores threads; do
            log=$(find "build/runtime-work/$scenario" -name 'FC3PerformancePatch.log' | head -n 1)
            if [ -n "$log" ]; then echo "--- $scenario"; grep -E 'cpu:|threads:' "$log" | head -n 16; fi
          done
